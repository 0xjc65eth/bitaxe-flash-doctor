name: Feature request
description: Suggest a verification check or workflow.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What flashing or verification mistake should this prevent?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the check, command, or output format you want.
    validations:
      required: true
